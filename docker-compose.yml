services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER belum di-set di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum di-set di .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB belum di-set di .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      PORT: 8080
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME belum di-set di .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD belum di-set di .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET belum di-set di .env}
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT belum di-set di .env}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${BACKEND_PUBLIC_URL:?BACKEND_PUBLIC_URL belum di-set di .env}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:?FRONTEND_PORT belum di-set di .env}:80"
    depends_on:
      - backend

volumes:
  db_data:
